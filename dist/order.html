<script type="module">

const $=id=>document.getElementById(id),app=$('app'),cartbar=$('cartbar'),cartbtn=$('cartbtn'),shade=$('shade'),linesEl=$('lines'),customer=$('customer'),place=$('place'),detail=$('detail');
const state={storeName:'',tableLabel:'',products:[],cart:{},category:'All',search:'',selected:null,payment:{counter:true,online:false,qr:null,instructions:''},payMethod:'counter',payRef:''};
const peso=n=>'₱'+Number(n||0).toFixed(2),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function token(){const q=new URLSearchParams(location.search).get('t');if(q)return q;const s=location.pathname.split('/').filter(Boolean);return s.at(-1)||null}
function qkey(p,v=null){return p.id+(v?'::'+v.id:'')}
function cartQty(key){return state.cart[key]?.qty||0} function count(){return Object.values(state.cart).reduce((a,x)=>a+x.qty,0)}
function linePrice(x){return Number(x.variant?.price??x.product.price)} function total(){return Object.values(state.cart).reduce((a,x)=>a+x.qty*linePrice(x),0)}

function placeholder(p){return `<div class="placeholder" style="${p.image_url||p.imageUrl?'display:none':''}">${esc(p.emoji||'🍽️')}</div>`}
function setLine(p,variant,newQty){const key=qkey(p,variant);newQty=Math.max(0,newQty);if(newQty)state.cart[key]={product:p,variant,qty:newQty};else delete state.cart[key];updateBar()}
function updateBar(){const c=count();cartbar.hidden=!c;$('cartcount').textContent=`${c} item${c===1?'':'s'}`;$('carttotal').textContent=peso(total())}
function cats(){return ['All',...new Set(state.products.map(p=>p.category).filter(Boolean))].map(c=>`<button class="cat ${state.category===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}

function render(){app.innerHTML=`<header class="top"><div class="topin"><div class="logo">M</div><div class="store"><b>${esc(state.storeName)}</b><span>${esc(state.tableLabel)} · Order from your table</span></div></div></header><section class="hero"><h1>What would you like?</h1><p>Choose your favorites and send your order straight to the staff.</p><div class="search"><span>⌕</span><input id="search" type="search" placeholder="Search menu" value="${esc(state.search)}"></div></section><nav class="cats" id="cats">${cats()}</nav><div class="heading"><h2>${state.category==='All'?'Menu':esc(state.category)}</h2><span id="count"></span></div><main class="menu" id="menu"></main>`;$('search').oninput=e=>{state.search=e.target.value;renderProducts()};$('cats').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;state.category=b.dataset.cat;render()};renderProducts()}
const findP=id=>state.products.find(p=>String(p.id)===String(id));
function productQty(p){let n=0;for(const k in state.cart)if(state.cart[k].product.id===p.id)n+=state.cart[k].qty;return n}
function isSold(p){return Boolean(p.track_stock&&Number(p.stock_qty??p.stockQty??0)<=0)}
function stockLeft(p){return p.track_stock?Number(p.stock_qty??p.stockQty??0)-productQty(p):Infinity}
function renderProducts(){const list=filtered();$('count').textContent=`${list.length} item${list.length===1?'':'s'}`;const menu=$('menu');if(!list.length){menu.innerHTML='<div class="state" style="min-height:300px"><div><div class="ico">🔎</div><h2>No items found</h2><p>Try another search or category.</p></div></div>';return}menu.innerHTML=list.map(p=>{const has=(p.variants||[]).length>0;const q=productQty(p);const sold=isSold(p);return `<article class="product${sold?' soldout':''}" data-product="${esc(p.id)}" role="button" tabindex="0"><div class="photo">${photo(p)}${placeholder(p)}${q?`<span class="inbag">${q}</span>`:''}</div><div class="body"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||p.category||'')}</div><div class="bottom"><div class="price">${has?'From ':''}${peso(p.price)}</div>${sold?'<span class="sold">Sold out</span>':''}</div></div></article>`}).join('');
menu.onclick=e=>{const card=e.target.closest('.product');if(card)openDetail(findP(card.dataset.product))};
menu.onkeydown=e=>{if(e.key!=='Enter')return;const card=e.target.closest('.product');if(card)openDetail(findP(card.dataset.product))}}
function closeDetail(){if(detail.classList.contains('show')&&history.state&&history.state.detail)history.back();else detail.classList.remove('show')}
window.addEventListener('popstate',()=>detail.classList.remove('show'));
if(history.state&&history.state.detail)history.replaceState(null,'');
function openDetail(p){if(!p)return;state.selected=p;const vs=p.variants||[];const sold=isSold(p);const inCart=productQty(p);const dd=p.description||(vs.length?'Choose your preferred option, then add it to your order.':'');detail.innerHTML=`<div class="detailinner"><div class="detailhero">${photo(p)}${placeholder(p)}<button class="back" id="back" aria-label="Back">‹</button></div><div class="detailbody"><h2>${esc(p.name)}</h2><div class="dp">${vs.length?'From ':''}${peso(p.price)}</div>${inCart?`<div class="incart">${inCart} in your cart</div>`:''}${dd?`<div class="dd">${esc(dd)}</div>`:''}${vs.length?`<div class="variants"><h3>${sold?'Options':'Choose an option'}</h3>${vs.map((v,i)=>`<button class="variant ${!sold&&i===0?'selected':''}" data-var="${esc(v.id)}" ${sold?'disabled':''}><b>${esc(v.name)}</b><span>${peso(v.price)}</span></button>`).join('')}</div>`:''}${sold?'<div class="soldnote">Sold out right now</div>':'<div class="detailqty"><button id="qminus" aria-label="Less">−</button><b id="qval">1</b><button id="qplus" aria-label="More">+</button></div><button class="detailadd" id="detailadd">Add to cart</button>'}</div></div>`;detail.scrollTop=0;detail.classList.add('show');history.pushState({detail:1},'');$('back').onclick=closeDetail;const add=$('detailadd');if(!add)return;let chosen=vs[0]||null,qty=1;const maxQ=()=>stockLeft(p);const sync=()=>{const unit=Number(chosen?chosen.price:p.price);$('qval').textContent=qty;$('qminus').disabled=qty<=1;$('qplus').disabled=qty>=maxQ();add.textContent=`${chosen?`Add ${chosen.name}`:'Add to cart'}${qty>1?` ×${qty}`:''} · ${peso(unit*qty)}`};detail.querySelectorAll('[data-var]').forEach(b=>b.onclick=()=>{chosen=vs.find(v=>String(v.id)===b.dataset.var);detail.querySelectorAll('.variant').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');sync()});if(maxQ()<=0){$('qminus').disabled=true;$('qplus').disabled=true;add.textContent='All available items are in your cart';add.disabled=true;return}$('qminus').onclick=()=>{if(qty>1){qty--;sync()}};$('qplus').onclick=()=>{if(qty<maxQ()){qty++;sync()}};sync();add.onclick=()=>{if(qty>maxQ())return;setLine(p,chosen,cartQty(qkey(p,chosen))+qty);closeDetail();renderProducts()}}
function renderPay(){const box=$('pay'),o=state.payment;if(!o.online)state.payMethod='counter';else if(!o.counter)state.payMethod='online';const both=o.counter&&o.online;let h='';if(both)h+=`<div class="paychoice"><button type="button" class="payopt ${state.payMethod==='counter'?'on':''}" data-pay="counter"><b>Pay at the counter</b><span>Pay when you're done</span></button><button type="button" class="payopt ${state.payMethod==='online'?'on':''}" data-pay="online"><b>Pay online</b><span>GCash, Maya or bank QR</span></button></div>`;else h+=`<div class="paynote">${o.online?'Payment: online — pay now using the QR below.':'Payment: pay at the counter when you\'re done.'}</div>`;if(state.payMethod==='online')h+=`<div class="payqr">${o.qr?`<img src="${esc(o.qr)}" alt="Payment QR code">`:''}<div class="payamt">Pay ${peso(total())}</div><p>${esc(o.instructions||'Scan the QR with your e-wallet or banking app, then enter the reference number below.')}</p><p class="tip">Ordering on this phone? Take a screenshot of the QR, then in your e-wallet choose Pay QR and upload it from your gallery.</p><label for="payref">Reference number</label><input id="payref" maxlength="60" autocomplete="off" placeholder="From your payment confirmation" value="${esc(state.payRef)}"></div>`;box.innerHTML=h;box.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{state.payMethod=b.dataset.pay;renderPay()});const r=$('payref');if(r)r.oninput=e=>{state.payRef=e.target.value}}

cartbtn.onclick=openCart;$('close').onclick=closeCart;$('keep').onclick=closeCart;shade.onclick=e=>{if(e.target===shade)closeCart()};
function orderError(m){m=m||'';if(m==='invalid_or_inactive_table')return 'This table is not accepting orders right now. Please ask staff for help.';if(m==='payment_reference_required')return 'Enter the reference number from your payment so staff can confirm it.';if(m==='payment_method_unavailable'||m==='invalid_payment_method')return 'That payment option is not available right now. Please choose another.';if(m.startsWith('invalid_product')||m.startsWith('invalid_variant')||m.startsWith('variant_required'))return 'An item is no longer available. Please review your order.';return 'Something went wrong. Please try again.'}
async function submit(){const vals=Object.values(state.cart);if(!vals.length)return;if(state.payMethod==='online'&&state.payRef.trim().length<4){$('err').innerHTML='<div class="error">Enter the reference number from your payment so staff can confirm it.</div>';return}place.disabled=true;place.textContent='Sending order…';$('err').innerHTML='';try{const items=vals.map(x=>({product_id:x.product.id,variant_id:x.variant?.id||null,quantity:x.qty}));const paidOnline=state.payMethod==='online',ref=state.payRef.trim();const{data:orderId,error}=await supabase.rpc('submit_qr_order',{p_qr_token:token(),p_customer_name:customer.value.trim()||null,p_items:items,p_payment_method:state.payMethod,p_payment_reference:state.payMethod==='online'?state.payRef.trim():null});if(error)throw error;state.cart={};updateBar();closeCart();app.innerHTML=`<div class="success"><div class="successicon">✓</div><h2>Order received!</h2><p>Your cart has been sent to the staff. Please stay at your table while they prepare it.</p><p>${paidOnline?`Payment reference: <b>${esc(ref)}</b>. Staff will confirm your payment shortly.`:'Please pay at the counter when you\'re done.'}</p><div class="ref">Order #${esc(String(orderId).slice(0,8).toUpperCase())}</div><br><button class="place" style="margin-top:22px;width:100%;max-width:330px" onclick="location.reload()">Order something else</button></div>`}catch(e){$('err').innerHTML=`<div class="error">${orderError(e.message)}</div>`;place.disabled=false;place.textContent='Place order'}}
place.onclick=submit;
async function load(){const t=token();if(!t){app.innerHTML='<div class="state"><div><div class="ico">⚠️</div><h2>QR code not found</h2><p>Please scan the QR code on your table again.</p></div></div>';return}try{const{data,error}=await supabase.rpc('get_menu_for_qr',{p_qr_token:t});if(error)throw error;state.storeName=data.store_name||'MERQ';state.tableLabel=data.table_label||'Table';state.products=data.products||[];const pm=data.payment||{};state.payment={counter:pm.counter!==false,online:Boolean(pm.online&&pm.qr_url),qr:pm.qr_url||null,instructions:pm.instructions||''};state.payMethod=state.payment.counter?'counter':'online';render();updateBar()}catch(e){app.innerHTML=`<div class="state"><div><div class="ico">⚠️</div><h2>Menu unavailable</h2><p>${e.message==='invalid_or_inactive_table'?'This QR code is invalid or this table is not accepting orders right now.':'We could not load the menu. Please try again or ask staff for help.'}</p></div></div>`}}
load();
</script></body></html>
