<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Order — MERQ</title>
<style>
  :root {
    --charcoal: #121417;
    --slate: #1c1f24;
    --slate-light: #262a31;
    --amber: #f5a623;
    --amber-dim: #b9791a;
    --text-primary: #f2f2f0;
    --text-secondary: #b7bcc4;
    --text-muted: #7a808a;
    --red: #e5484d;
    --green: #3ecf8e;
    --border: #33383f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--charcoal);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  #app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: 16px 16px 96px;
  }

  header.store-header {
    padding: 8px 4px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  header.store-header h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  header.store-header p {
    margin: 0;
    color: var(--text-secondary);
    font-size: 13px;
  }

  .center-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 12px;
    padding: 40px 20px;
  }
  .center-state .icon { font-size: 40px; }
  .center-state h2 { margin: 0; font-size: 17px; }
  .center-state p { margin: 0; color: var(--text-secondary); font-size: 14px; max-width: 320px; }

  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--amber);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .product-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .product-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--slate);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
  }
  .product-emoji {
    font-size: 26px;
    width: 40px;
    text-align: center;
    flex-shrink: 0;
  }
  .product-info { flex: 1; min-width: 0; }
  .product-info .name {
    font-size: 14.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .product-info .price {
    font-size: 13px;
    color: var(--amber);
    margin-top: 2px;
  }

  .stepper {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .stepper button {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--slate-light);
    color: var(--text-primary);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  .stepper button:disabled { opacity: 0.35; cursor: default; }
  .stepper button.add { border-color: var(--amber-dim); color: var(--amber); }
  .stepper .qty {
    min-width: 18px;
    text-align: center;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }

  .cart-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--slate);
    border-top: 1px solid var(--border);
    display: none;
    justify-content: center;
  }
  .cart-bar.visible { display: flex; }
  .cart-bar button {
    max-width: 560px;
    width: 100%;
    background: var(--amber);
    color: #1a1300;
    border: none;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }

  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
  }
  .sheet-backdrop.visible { display: flex; }
  .sheet {
    width: 100%;
    max-width: 560px;
    background: var(--charcoal);
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    border: 1px solid var(--border);
    border-bottom: none;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .sheet-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 14px;
  }
  .sheet h2 { margin: 0 0 12px; font-size: 17px; }
  .sheet .cart-lines { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .cart-line {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .cart-line .line-info { flex: 1; min-width: 0; }
  .cart-line .line-info .name { font-size: 14px; }
  .cart-line .line-info .line-price { font-size: 12.5px; color: var(--text-muted); }

  .name-field {
    margin: 14px 0 6px;
  }
  .name-field label {
    display: block;
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .name-field input {
    width: 100%;
    background: var(--slate);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 12px;
    color: var(--text-primary);
    font-size: 14px;
  }
  .name-field input:focus { outline: 1px solid var(--amber); }

  .sheet-total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 14px 0 12px;
    font-size: 15px;
  }
  .sheet-total .amount { color: var(--amber); font-weight: 700; font-size: 18px; }

  .btn-primary {
    background: var(--amber);
    color: #1a1300;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-ghost {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 13.5px;
    padding: 10px;
    cursor: pointer;
    width: 100%;
  }

  .error-banner {
    background: rgba(229,72,77,0.12);
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 12px;
  }

  .order-ref {
    font-family: monospace;
    background: var(--slate);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    color: var(--amber);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="center-state" id="loading-state">
    <div class="spinner"></div>
    <p>Loading menu…</p>
  </div>
</div>

<div class="cart-bar" id="cart-bar">
  <button id="cart-bar-btn" type="button"></button>
</div>

<div class="sheet-backdrop" id="sheet-backdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Your order</h2>
    <div id="error-slot"></div>
    <div class="cart-lines" id="cart-lines"></div>
    <div class="name-field">
      <label for="customer-name">Name (optional, helps staff call you)</label>
      <input type="text" id="customer-name" placeholder="e.g. Marco" maxlength="60" />
    </div>
    <div class="sheet-total">
      <span>Total</span>
      <span class="amount" id="sheet-total-amount">₱0.00</span>
    </div>
    <button class="btn-primary" id="submit-order-btn">Place order</button>
    <button class="btn-ghost" id="close-sheet-btn">Keep browsing</button>
  </div>
</div>

<script type="module">
  // ---------------------------------------------------------------------
  // TODO before deploying:
  // 1. Fill in SUPABASE_URL / SUPABASE_ANON_KEY below with the real
  //    project values from lib/config/supabase_config.dart. I've seen
  //    the URL written two slightly different ways in earlier session
  //    notes (uykrnoxlzlvjtazicjim vs ...taziqjim) so double-check the
  //    exact string rather than trusting either here.
  // 2. This file needs to be reachable at a URL containing the table's
  //    qr_token — either as a path segment your host rewrites down to
  //    this file (e.g. /order/<token> -> /order/index.html) or as a
  //    query string (/order/index.html?t=<token>). Both are supported
  //    below; use whichever your static host makes easiest.
  // ---------------------------------------------------------------------
  const SUPABASE_URL = 'https://uykrnoxlzlvjtazicjim.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5a3Jub3hsemx2anRhemljamltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NjE3MDcsImV4cCI6MjEwMTEzNzcwN30.dLqbFc9NOn1fdyTlnlduz86Jl4fxw8KqSaY7Ra8MzbE';

  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const app = document.getElementById('app');
  const cartBar = document.getElementById('cart-bar');
  const cartBarBtn = document.getElementById('cart-bar-btn');
  const sheetBackdrop = document.getElementById('sheet-backdrop');
  const cartLinesEl = document.getElementById('cart-lines');
  const sheetTotalEl = document.getElementById('sheet-total-amount');
  const customerNameInput = document.getElementById('customer-name');
  const submitBtn = document.getElementById('submit-order-btn');
  const closeSheetBtn = document.getElementById('close-sheet-btn');
  const errorSlot = document.getElementById('error-slot');

  const peso = (n) => '₱' + Number(n).toFixed(2);

  function getQrToken() {
    const params = new URLSearchParams(window.location.search);
    const fromQuery = params.get('t');
    if (fromQuery) return fromQuery;
    const segments = window.location.pathname.split('/').filter(Boolean);
    return segments.length ? segments[segments.length - 1] : null;
  }

  function renderCenterState({ icon, title, message }) {
    app.innerHTML = `
      <div class="center-state">
        <div class="icon">${icon}</div>
        <h2>${title}</h2>
        <p>${message}</p>
      </div>`;
  }

  const state = {
    storeName: '',
    tableLabel: '',
    products: [],
    cart: {}, // product_id -> { product, qty }
  };

  function cartCount() {
    return Object.values(state.cart).reduce((sum, l) => sum + l.qty, 0);
  }
  function cartTotal() {
    return Object.values(state.cart).reduce((sum, l) => sum + l.qty * Number(l.product.price), 0);
  }

  function updateCartBar() {
    const count = cartCount();
    if (count === 0) {
      cartBar.classList.remove('visible');
      return;
    }
    cartBar.classList.add('visible');
    cartBarBtn.innerHTML = `
      <span>${count} item${count > 1 ? 's' : ''} in cart</span>
      <span>${peso(cartTotal())}</span>`;
  }

  function setQty(product, qty) {
    qty = Math.max(0, qty);
    if (qty === 0) {
      delete state.cart[product.id];
    } else {
      state.cart[product.id] = { product, qty };
    }
    updateCartBar();
    const qtyEl = document.getElementById('qty-' + product.id);
    if (qtyEl) qtyEl.textContent = qty;
    const minusBtn = document.getElementById('minus-' + product.id);
    if (minusBtn) minusBtn.disabled = qty === 0;
  }

  function renderMenu() {
    app.innerHTML = `
      <header class="store-header">
        <h1>${state.storeName}</h1>
        <p>${state.tableLabel}</p>
      </header>
      <div class="product-list" id="product-list"></div>
    `;
    const list = document.getElementById('product-list');
    if (state.products.length === 0) {
      list.innerHTML = `<p style="color:var(--text-muted); font-size:14px;">No items available right now — check back soon.</p>`;
      return;
    }
    for (const product of state.products) {
      const row = document.createElement('div');
      row.className = 'product-row';
      row.innerHTML = `
        <div class="product-emoji">${product.emoji || '🍽️'}</div>
        <div class="product-info">
          <div class="name">${product.name}</div>
          <div class="price">${peso(product.price)}</div>
        </div>
        <div class="stepper">
          <button id="minus-${product.id}" type="button" disabled>−</button>
          <span class="qty" id="qty-${product.id}">0</span>
          <button class="add" type="button">+</button>
        </div>
      `;
      const [minusBtn, plusBtn] = row.querySelectorAll('button');
      minusBtn.addEventListener('click', () => {
        const current = state.cart[product.id]?.qty || 0;
        setQty(product, current - 1);
      });
      plusBtn.addEventListener('click', () => {
        const current = state.cart[product.id]?.qty || 0;
        setQty(product, current + 1);
      });
      list.appendChild(row);
    }
  }

  function openCartSheet() {
    errorSlot.innerHTML = '';
    cartLinesEl.innerHTML = '';
    const lines = Object.values(state.cart);
    if (lines.length === 0) {
      cartLinesEl.innerHTML = `<p style="color:var(--text-muted); font-size:14px;">Your cart is empty.</p>`;
    }
    for (const line of lines) {
      const el = document.createElement('div');
      el.className = 'cart-line';
      el.innerHTML = `
        <div class="line-info">
          <div class="name">${line.qty}× ${line.product.name}</div>
          <div class="line-price">${peso(line.qty * line.product.price)}</div>
        </div>
      `;
      cartLinesEl.appendChild(el);
    }
    sheetTotalEl.textContent = peso(cartTotal());
    submitBtn.disabled = lines.length === 0;
    sheetBackdrop.classList.add('visible');
  }
  function closeCartSheet() {
    sheetBackdrop.classList.remove('visible');
  }

  cartBarBtn.addEventListener('click', openCartSheet);
  closeSheetBtn.addEventListener('click', closeCartSheet);
  sheetBackdrop.addEventListener('click', (e) => {
    if (e.target === sheetBackdrop) closeCartSheet();
  });

  async function submitOrder() {
    const lines = Object.values(state.cart);
    if (lines.length === 0) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';
    errorSlot.innerHTML = '';

    const items = lines.map((l) => ({ product_id: l.product.id, quantity: l.qty }));

    try {
      const { data: orderId, error } = await supabase.rpc('submit_qr_order', {
        p_qr_token: getQrToken(),
        p_customer_name: customerNameInput.value || null,
        p_items: items,
      });

      if (error) throw error;

      state.cart = {};
      updateCartBar();
      closeCartSheet();
      renderCenterState({
        icon: '✅',
        title: 'Order sent!',
        message: `Staff will confirm your order shortly. Reference: <br/><span class="order-ref">${String(orderId).slice(0, 8)}</span>`,
      });
    } catch (err) {
      const message =
        err.message === 'invalid_or_inactive_table'
          ? 'This table isn\u2019t accepting orders right now — please flag down staff.'
          : err.message?.startsWith('invalid_product')
          ? 'One of the items in your cart is no longer available. Please remove it and try again.'
          : err.message === 'empty_order'
          ? 'Your cart is empty.'
          : 'Something went wrong sending your order. Please try again.';
      errorSlot.innerHTML = `<div class="error-banner">${message}</div>`;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Place order';
    }
  }
  submitBtn.addEventListener('click', submitOrder);

  async function loadMenu() {
    const token = getQrToken();
    if (!token) {
      renderCenterState({
        icon: '⚠️',
        title: 'Missing QR code',
        message: 'This link is missing its table code. Please re-scan the QR code on your table.',
      });
      return;
    }

    try {
      const { data, error } = await supabase.rpc('get_menu_for_qr', { p_qr_token: token });
      if (error) throw error;

      state.storeName = data.store_name;
      state.tableLabel = data.table_label;
      state.products = data.products || [];
      renderMenu();
      updateCartBar();
    } catch (err) {
      console.error('get_menu_for_qr failed:', err);
      window.__lastMenuError = err;
      renderCenterState({
        icon: '⚠️',
        title: 'Can\u2019t load this menu',
        message:
          err.message === 'invalid_or_inactive_table'
            ? 'This QR code isn\u2019t valid, or this table isn\u2019t taking orders right now. Please ask staff for help.'
            : 'Something went wrong loading the menu. Please try again or ask staff for help.'
              + ' [DEBUG: ' + (err.code || '') + ' ' + (err.message || err) + ' ' + (err.details || '') + ' ' + (err.hint || '') + ']',
      });
    }
  }

  loadMenu();
</script>
</body>
</html>
