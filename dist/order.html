<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Order — MERQ</title>
<style>
:root{--ink:#171717;--muted:#707070;--line:#ececec;--surface:#fff;--soft:#f7f7f7;--brand:#d71920;--brand2:#b91017;--accent:#ffb400;--green:#18864b;--shadow:0 8px 28px rgba(0,0,0,.09)}*{box-sizing:border-box}html,body{margin:0;background:#f7f7f7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}button,input{font:inherit}button{cursor:pointer}.shell{max-width:600px;margin:auto;background:#fff;min-height:100vh}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}.topin{padding:12px 16px;display:flex;align-items:center;gap:11px}.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}.store{min-width:0;flex:1}.store b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.store span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.hero{padding:20px 16px 16px;background:linear-gradient(180deg,#fff,#fff8f2)}.hero h1{font-size:25px;line-height:1.1;margin:0 0 7px}.hero p{margin:0 0 15px;color:#666;font-size:13px}.search{height:46px;border:1px solid #e3e3e3;background:#fff;border-radius:14px;display:flex;align-items:center;padding:0 13px;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.03)}.search span{font-size:21px;color:#777}.search input{border:0;outline:0;width:100%;background:transparent;font-size:14px}.cats{display:flex;gap:8px;overflow:auto;padding:13px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{border:1px solid #ddd;background:#fff;color:#555;border-radius:999px;padding:9px 15px;white-space:nowrap;font-size:13px;font-weight:700}.cat.active{background:var(--ink);color:#fff;border-color:var(--ink)}.heading{display:flex;justify-content:space-between;align-items:end;padding:18px 16px 10px}.heading h2{margin:0;font-size:19px}.heading span{font-size:12px;color:#888}.menu{padding:0 12px 20px}.product{display:flex;gap:13px;padding:13px 4px;border-bottom:1px solid var(--line);min-height:140px}.photo{width:122px;height:122px;border-radius:16px;background:#f1f1f1;overflow:hidden;flex:none;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.placeholder{width:100%;height:100%;display:grid;place-items:center;font-size:42px}.body{flex:1;min-width:0;display:flex;flex-direction:column}.name{font-size:16px;font-weight:800;line-height:1.2}.desc{color:#777;font-size:12px;line-height:1.35;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.bottom{margin-top:auto;display:flex;align-items:end;justify-content:space-between;gap:8px;padding-top:10px}.price{font-weight:900;font-size:16px}.add{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:10px;min-width:70px;height:36px;font-size:12px;font-weight:900}.add:active{transform:scale(.97)}.qty{display:flex;align-items:center;border:1px solid #ddd;border-radius:10px;height:36px;overflow:hidden}.qty button{width:34px;height:100%;border:0;background:#fff;font-size:19px}.qty b{min-width:28px;text-align:center;font-size:13px}.sold{font-size:11px;color:#a33;font-weight:800;background:#fff0f0;padding:9px;border-radius:9px}.cartbar{position:fixed;z-index:15;bottom:0;left:0;right:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid #ddd}.cartbtn{max-width:576px;margin:auto;width:100%;height:54px;border:0;border-radius:14px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:900;box-shadow:0 7px 20px rgba(215,25,32,.22)}.cartbtn small{display:block;font-weight:700;opacity:.9}.cartbtn strong{font-size:15px}.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none;align-items:flex-end}.shade.show{display:flex}.sheet{background:#fff;width:100%;max-width:600px;margin:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(15px + env(safe-area-inset-bottom));max-height:92vh;display:flex;flex-direction:column}.handle{width:38px;height:4px;background:#ddd;border-radius:4px;margin:2px auto 13px}.sheethead{display:flex;align-items:center;justify-content:space-between}.sheethead h2{margin:0;font-size:20px}.x{border:0;background:#f2f2f2;border-radius:50%;width:34px;height:34px}.lines{overflow:auto;margin-top:8px}.line{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.lineinfo{flex:1;min-width:0}.linename{font-size:14px;font-weight:800}.lineprice{font-size:12px;color:#777;margin-top:3px}.lineqty{display:flex;align-items:center;border:1px solid #ddd;border-radius:9px;overflow:hidden}.lineqty button{width:31px;height:31px;border:0;background:#fff}.lineqty b{min-width:26px;text-align:center;font-size:12px}.customer{margin-top:14px}.customer label{font-size:12px;color:#666;display:block;margin-bottom:6px}.customer input{width:100%;height:43px;border:1px solid #ddd;border-radius:10px;padding:0 12px;outline:0}.total{display:flex;justify-content:space-between;align-items:center;padding:16px 0 11px;font-weight:800}.total strong{font-size:21px}.place{height:50px;border:0;border-radius:13px;background:var(--brand);color:#fff;font-weight:900}.place:disabled{opacity:.5}.keep{border:0;background:#fff;color:#666;height:42px;font-size:13px}.detail{position:fixed;inset:0;background:#fff;z-index:40;display:none;overflow:auto}.detail.show{display:block}.detailinner{max-width:600px;margin:auto;min-height:100%;padding-bottom:25px}.detailhero{height:310px;background:#f2f2f2;position:relative}.detailhero img{width:100%;height:100%;object-fit:cover}.back{position:absolute;left:14px;top:14px;border:0;background:rgba(255,255,255,.9);width:42px;height:42px;border-radius:50%;font-size:22px}.detailbody{padding:20px 18px}.detailbody h2{font-size:25px;margin:0}.detailbody .dp{font-size:21px;font-weight:900;margin-top:7px}.detailbody .dd{color:#666;line-height:1.5;font-size:14px;margin-top:10px}.variants{margin-top:22px}.variants h3{font-size:15px;margin:0 0 10px}.variant{display:flex;align-items:center;justify-content:space-between;border:1px solid #ddd;border-radius:12px;padding:13px;margin-bottom:8px}.variant.selected{border:2px solid var(--brand);padding:12px;background:#fff8f8}.variant b{font-size:14px}.variant span{font-weight:800;font-size:13px}.detailadd{margin-top:18px;width:100%;height:52px;border:0;border-radius:13px;background:var(--brand);color:#fff;font-weight:900;font-size:15px}.state{min-height:70vh;display:grid;place-items:center;text-align:center;padding:30px}.state div{max-width:330px}.state .ico{font-size:42px}.state h2{margin:10px 0 5px}.state p{color:#777;font-size:14px;line-height:1.5}.error{background:#fff0f0;color:#a22;border:1px solid #f1b9b9;border-radius:10px;padding:10px;font-size:12px;margin-bottom:8px}.success{padding:65px 22px;text-align:center}.successicon{width:72px;height:72px;border-radius:50%;background:#eaf8ef;color:var(--green);display:grid;place-items:center;font-size:40px;margin:auto}.success h2{font-size:26px;margin:18px 0 8px}.success p{color:#666;line-height:1.5}.ref{display:inline-block;background:#f5f5f5;border-radius:10px;padding:10px 14px;font-weight:900;letter-spacing:1px;margin-top:10px}
@media(min-width:601px){body{background:#e9e9e9}.shell{box-shadow:0 0 40px rgba(0,0,0,.08)}}
</style>
</head>
<body>
<div class="shell" id="app"><div class="state"><div><div class="ico">⏳</div><h2>Loading menu</h2><p>Please wait a moment…</p></div></div></div>
<div class="cartbar" id="cartbar" hidden><button class="cartbtn" id="cartbtn"><span><small id="cartcount">0 items</small>View order</span><strong id="carttotal">₱0.00</strong></button></div>
<div class="shade" id="shade"><div class="sheet"><div class="handle"></div><div class="sheethead"><h2>Your order</h2><button class="x" id="close">×</button></div><div id="err"></div><div class="lines" id="lines"></div><div class="customer"><label for="customer">Name (optional)</label><input id="customer" maxlength="60" placeholder="e.g. Marco"></div><div class="total"><span>Total</span><strong id="stotal">₱0.00</strong></div><button class="place" id="place">Place order</button><button class="keep" id="keep">Continue browsing</button></div></div>
<div class="detail" id="detail"></div>
<script type="module">
const SUPABASE_URL='https://uykrnoxlzlvjtazicjim.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ1eXJrb3hsemx2anRhemljamltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NjE3MDcsImV4cCI6MjEwMTEzNzcwN30.dLqbFc9NOn1fdyTlnlduz86Jl4fxw8KqSaY7Ra8MzbE';
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id),app=$('app'),cartbar=$('cartbar'),cartbtn=$('cartbtn'),shade=$('shade'),linesEl=$('lines'),customer=$('customer'),place=$('place'),detail=$('detail');
const state={storeName:'',tableLabel:'',products:[],cart:{},category:'All',search:'',selected:null};
const peso=n=>'₱'+Number(n||0).toFixed(2),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function token(){const q=new URLSearchParams(location.search).get('t');if(q)return q;const s=location.pathname.split('/').filter(Boolean);return s.at(-1)||null}
function qkey(p,v=null){return p.id+(v?'::'+v.id:'')}
function cartQty(key){return state.cart[key]?.qty||0} function count(){return Object.values(state.cart).reduce((a,x)=>a+x.qty,0)}
function linePrice(x){return Number(x.variant?.price??x.product.price)} function total(){return Object.values(state.cart).reduce((a,x)=>a+x.qty*linePrice(x),0)}
function photo(p,cls=''){const u=p.image_url||p.imageUrl;return u?`<img class="${cls}" src="${esc(u)}" alt="${esc(p.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`:''}
function placeholder(p){return `<div class="placeholder" style="${p.image_url||p.imageUrl?'display:none':''}">${esc(p.emoji||'🍽️')}</div>`}
function setLine(p,variant,newQty){const key=qkey(p,variant);newQty=Math.max(0,newQty);if(newQty)state.cart[key]={product:p,variant,qty:newQty};else delete state.cart[key];updateBar()}
function updateBar(){const c=count();cartbar.hidden=!c;$('cartcount').textContent=`${c} item${c===1?'':'s'}`;$('carttotal').textContent=peso(total())}
function cats(){return ['All',...new Set(state.products.map(p=>p.category).filter(Boolean))].map(c=>`<button class="cat ${state.category===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
function filtered(){const q=state.search.trim().toLowerCase();return state.products.filter(p=>(state.category==='All'||p.category===state.category)&&(!q||`${p.name} ${p.description||''}`.toLowerCase().includes(q)))}
function render(){app.innerHTML=`<header class="top"><div class="topin"><div class="logo">M</div><div class="store"><b>${esc(state.storeName)}</b><span>${esc(state.tableLabel)} · Order from your table</span></div></div></header><section class="hero"><h1>What would you like?</h1><p>Choose your favorites and send your order straight to the staff.</p><div class="search"><span>⌕</span><input id="search" type="search" placeholder="Search menu" value="${esc(state.search)}"></div></section><nav class="cats" id="cats">${cats()}</nav><div class="heading"><h2>${state.category==='All'?'Menu':esc(state.category)}</h2><span id="count"></span></div><main class="menu" id="menu"></main>`;$('search').oninput=e=>{state.search=e.target.value;renderProducts()};$('cats').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;state.category=b.dataset.cat;render()};renderProducts()}
function renderProducts(){const list=filtered();$('count').textContent=`${list.length} item${list.length===1?'':'s'}`;const menu=$('menu');if(!list.length){menu.innerHTML='<div class="state" style="min-height:300px"><div><div class="ico">🔎</div><h2>No items found</h2><p>Try another search or category.</p></div></div>';return}menu.innerHTML=list.map(p=>{const variants=p.variants||[];const has=variants.length>0;let totalQty=0;for(const k in state.cart)if(k.startsWith(p.id+'::'))totalQty+=state.cart[k].qty;if(!has)totalQty=cartQty(p.id);const sold=Boolean(p.track_stock&&Number(p.stock_qty??p.stockQty??0)<=0);return `<article class="product" data-product="${esc(p.id)}"><div class="photo">${photo(p)}${placeholder(p)}</div><div class="body"><div class="name">${esc(p.name)}</div><div class="desc">${esc(p.description||p.category||'')}</div><div class="bottom"><div class="price">${has?'From ':''}${peso(p.price)}</div>${sold?'<span class="sold">Sold out</span>':`<button class="add" data-open="${esc(p.id)}">${totalQty?'ADD MORE':'ADD'}</button>`}</div></div></article>`}).join('');menu.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(state.products.find(p=>String(p.id)===b.dataset.open)))}
function openDetail(p){if(!p)return;state.selected=p;const vs=p.variants||[];detail.innerHTML=`<div class="detailinner"><div class="detailhero">${photo(p)}${placeholder(p)}<button class="back" id="back">‹</button></div><div class="detailbody"><h2>${esc(p.name)}</h2><div class="dp">${vs.length?'From ':''}${peso(p.price)}</div><div class="dd">${esc(p.description||'Choose your preferred option, then add it to your order.')}</div>${vs.length?`<div class="variants"><h3>Choose an option</h3>${vs.map((v,i)=>`<button class="variant ${i===0?'selected':''}" data-var="${esc(v.id)}"><b>${esc(v.name)}</b><span>${peso(v.price)}</span></button>`).join('')}</div>`:''}<button class="detailadd" id="detailadd">Add to order</button></div></div>`;detail.classList.add('show');$('back').onclick=()=>detail.classList.remove('show');let chosen=vs[0]||null;detail.querySelectorAll('[data-var]').forEach(b=>b.onclick=()=>{chosen=vs.find(v=>String(v.id)===b.dataset.var);detail.querySelectorAll('.variant').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('detailadd').textContent=`Add ${chosen.name} · ${peso(chosen.price)}`});$('detailadd').textContent=chosen?`Add ${chosen.name} · ${peso(chosen.price)}`:`Add to order · ${peso(p.price)}`;$('detailadd').onclick=()=>{setLine(p,chosen,cartQty(qkey(p,chosen))+1);detail.classList.remove('show');renderProducts()}}
function openCart(){const vals=Object.values(state.cart);linesEl.innerHTML=vals.length?vals.map(x=>`<div class="line"><div class="lineinfo"><div class="linename">${x.qty}× ${esc(x.product.name)}${x.variant?` · ${esc(x.variant.name)}`:''}</div><div class="lineprice">${peso(x.qty*linePrice(x))}</div></div><div class="lineqty"><button data-minus="${esc(qkey(x.product,x.variant))}">−</button><b>${x.qty}</b><button data-plus="${esc(qkey(x.product,x.variant))}">+</button></div></div>`).join(''):'<p style="color:#777">Your order is empty.</p>';$('stotal').textContent=peso(total());place.disabled=!vals.length;shade.classList.add('show');linesEl.querySelectorAll('[data-plus],[data-minus]').forEach(b=>b.onclick=()=>{const x=state.cart[b.dataset.plus||b.dataset.minus];if(!x)return;setLine(x.product,x.variant,x.qty+(b.dataset.plus?1:-1));openCart();renderProducts()})}
function closeCart(){shade.classList.remove('show')}
cartbtn.onclick=openCart;$('close').onclick=closeCart;$('keep').onclick=closeCart;shade.onclick=e=>{if(e.target===shade)closeCart()};
async function submit(){const vals=Object.values(state.cart);if(!vals.length)return;place.disabled=true;place.textContent='Sending order…';$('err').innerHTML='';try{const items=vals.map(x=>({product_id:x.product.id,quantity:x.qty}));const{data:orderId,error}=await supabase.rpc('submit_qr_order',{p_qr_token:token(),p_customer_name:customer.value.trim()||null,p_items:items});if(error)throw error;state.cart={};updateBar();closeCart();app.innerHTML=`<div class="success"><div class="successicon">✓</div><h2>Order received!</h2><p>Your order has been sent to the staff. Please stay at your table while they prepare it.</p><div class="ref">Order #${esc(String(orderId).slice(0,8).toUpperCase())}</div><br><button class="place" style="margin-top:22px;width:100%;max-width:330px" onclick="location.reload()">Order something else</button></div>`}catch(e){$('err').innerHTML=`<div class="error">${e.message==='invalid_or_inactive_table'?'This table is not accepting orders right now. Please ask staff for help.':e.message?.startsWith('invalid_product')?'An item is no longer available. Please review your order.':'Something went wrong. Please try again.'}</div>`;place.disabled=false;place.textContent='Place order'}}
place.onclick=submit;
async function load(){const t=token();if(!t){app.innerHTML='<div class="state"><div><div class="ico">⚠️</div><h2>QR code not found</h2><p>Please scan the QR code on your table again.</p></div></div>';return}try{const{data,error}=await supabase.rpc('get_menu_for_qr',{p_qr_token:t});if(error)throw error;state.storeName=data.store_name||'MERQ';state.tableLabel=data.table_label||'Table';state.products=data.products||[];render();updateBar()}catch(e){app.innerHTML=`<div class="state"><div><div class="ico">⚠️</div><h2>Menu unavailable</h2><p>${e.message==='invalid_or_inactive_table'?'This QR code is invalid or this table is not accepting orders right now.':'We could not load the menu. Please try again or ask staff for help.'}</p></div></div>`}}
load();
</script></body></html>
