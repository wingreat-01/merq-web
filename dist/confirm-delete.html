<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Confirm Account Deletion — MERQ POS</title>
<style>
  :root {
    --charcoal: #1E2126;
    --slate: #262b31;
    --slate-border: #363c44;
    --amber: #FFB020;
    --red: #e05252;
    --green: #7fd99a;
    --text: #f4f4f2;
    --text-muted: #9aa1ab;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--charcoal);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { max-width: 480px; width: 100%; padding: 20px; text-align: center; }
  .brand { font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: 1px; color: var(--amber); font-size: 15px; margin-bottom: 24px; }
  .card {
    background: var(--slate);
    border: 1px solid var(--slate-border);
    border-radius: 12px;
    padding: 32px 24px;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { color: var(--text-muted); font-size: 14.5px; margin: 0 0 8px; }
  .card.confirm h1 { color: var(--red); }
  .card.success h1 { color: var(--green); }
  .card.error h1 { color: var(--red); }

  .actions { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  button {
    width: 100%;
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  button:focus-visible, a.link:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  #deleteBtn { background: var(--red); color: #fff; }
  #deleteBtn:hover { background: #c94747; }
  #deleteBtn:disabled { background: #6e3d3d; cursor: not-allowed; }
  #cancelBtn { background: transparent; color: var(--text); border: 1px solid var(--slate-border); }
  #cancelBtn:hover { border-color: var(--text-muted); }
  #cancelBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  a.link { color: var(--amber); text-decoration: none; font-size: 13.5px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">MERQ POS</div>
  <div class="card" id="resultCard">
    <h1 id="resultTitle">Checking your link…</h1>
    <p id="resultText">One moment.</p>
    <div class="actions" id="actions" hidden>
      <button type="button" id="deleteBtn">Yes, permanently delete my account</button>
      <button type="button" id="cancelBtn">No, keep my account</button>
    </div>
    <p id="retryLinkWrap" hidden style="margin-top: 16px;"><a class="link" href="/delete-account.html">Request a new link</a></p>
  </div>
</div>

<script>
  // Nothing is deleted when this page loads. The request is only sent when
  // the person presses the delete button, so email link scanners that open
  // the link automatically can't trigger a deletion.
  const ENDPOINT = "https://uykrnoxlzlvjtazicjim.supabase.co/functions/v1/confirm-account-deletion";

  const token = new URLSearchParams(window.location.search).get("token");

  const card = document.getElementById("resultCard");
  const title = document.getElementById("resultTitle");
  const text = document.getElementById("resultText");
  const actions = document.getElementById("actions");
  const deleteBtn = document.getElementById("deleteBtn");
  const cancelBtn = document.getElementById("cancelBtn");
  const retryLinkWrap = document.getElementById("retryLinkWrap");

  function setState(kind, heading, message, opts) {
    opts = opts || {};
    card.className = "card " + kind;
    title.textContent = heading;
    text.textContent = message;
    actions.hidden = !opts.showActions;
    retryLinkWrap.hidden = !opts.showRequestLink;
  }

  function showConfirm() {
    setState(
      "confirm",
      "Delete your MERQ account?",
      "This permanently deletes your account, your store, its products, staff accounts, and your complete transaction history. It cannot be undone.",
      { showActions: true }
    );
    deleteBtn.disabled = false;
    cancelBtn.disabled = false;
    deleteBtn.textContent = "Yes, permanently delete my account";
  }

  async function deleteAccount() {
    deleteBtn.disabled = true;
    cancelBtn.disabled = true;
    deleteBtn.textContent = "Deleting…";

    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token }),
      });

      let data = {};
      try { data = await res.json(); } catch (_) {}

      if (res.ok) {
        setState("success", "Account deleted", data.message || "Your MERQ account and all associated data have been permanently deleted.");
        return;
      }

      if (res.status === 400) {
        // Invalid, used, or expired token: retrying with the same link won't help.
        setState("error", "This link can't be used", data.error || "This link is invalid or has expired.", { showRequestLink: true });
        return;
      }

      // Server-side failure: the link is still valid, so allow another attempt.
      setState("confirm", "Something went wrong", (data.error || "We couldn't finish deleting your account.") + " You can try again.", { showActions: true });
      deleteBtn.disabled = false;
      cancelBtn.disabled = false;
      deleteBtn.textContent = "Try again";
    } catch (err) {
      setState("confirm", "Couldn't reach the server", "Check your connection and try again, or email merq@prohubapps.com.", { showActions: true });
      deleteBtn.disabled = false;
      cancelBtn.disabled = false;
      deleteBtn.textContent = "Try again";
    }
  }

  deleteBtn.addEventListener("click", deleteAccount);
  cancelBtn.addEventListener("click", function () {
    setState("success", "Nothing was deleted", "Your account is unchanged. You can close this page.");
  });

  if (!token) {
    setState("error", "This link can't be used", "This link is missing its confirmation token. Use the link from your email, or request deletion again.", { showRequestLink: true });
  } else {
    showConfirm();
  }
</script>
</body>
</html>
